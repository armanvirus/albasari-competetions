name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run security audit
      run: npm audit --audit-level=moderate
    
    - name: Run linting
      run: npm run lint || echo "No linting script found"
    
    - name: Run tests
      run: npm test || echo "No tests found"
    
    - name: Build application
      run: npm run build || echo "No build script found"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Use Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build application
      run: npm run build || echo "No build script found"
    
    # Deploy to Railway (example)
    - name: Deploy to Railway
      if: ${{ env.RAILWAY_TOKEN != '' }}
      run: |
        npm install -g @railway/cli
        railway login --service ${{ secrets.RAILWAY_TOKEN }}
        railway up --service ${{ secrets.RAILWAY_SERVICE_ID }}
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    
    # Deploy to Heroku (example)
    - name: Deploy to Heroku
      if: ${{ env.HEROKU_API_KEY != '' }}
      uses: akhileshns/heroku-deploy@v3.12.12
      with:
        heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
        heroku_app_name: ${{ secrets.HEROKU_APP_NAME }}
        heroku_email: ${{ secrets.HEROKU_EMAIL }}
        healthcheck: "https://${{ secrets.HEROKU_APP_NAME }}.herokuapp.com/health"
        delay: 5
        rollbackonhealthcheckfailed: true
      env:
        HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
    
    # Deploy to Vercel (example)
    - name: Deploy to Vercel
      if: ${{ env.VERCEL_TOKEN != '' }}
      uses: amondnet/vercel-action@v20
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        vercel-args: '--prod'
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    
    # Deploy to DigitalOcean App Platform (example)
    - name: Deploy to DigitalOcean
      if: ${{ env.DIGITALOCEAN_ACCESS_TOKEN != '' }}
      uses: digitalocean/app_action@v1.1.5
      with:
        app_name: albasari-competitions
        token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        images: '[{"name":"api","source_dir":"./","github":{"repo":"${{ github.repository }}","branch":"main"},"run_command":"npm start"}]'
      env:
        DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
    
    - name: Notify deployment success
      if: success()
      run: |
        echo "Deployment successful! 🎉"
        echo "Application is now live and updated."
    
    - name: Notify deployment failure
      if: failure()
      run: |
        echo "Deployment failed! ❌"
        echo "Please check the logs and fix the issues."